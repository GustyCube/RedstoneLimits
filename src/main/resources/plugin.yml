name: RedstoneLimit
version: 1.0.0
main: xyz.gustycube.redstoneLimits.RedstoneLimits
api-version: 1.19
description: Limits redstone components and hoppers per player to prevent lag
author: GustyCube
commands:
  limit:
    description: Main command for RedstoneLimit plugin
    usage: /limit <check|reset|reload> [player]
    permission: redstonelimit.admin
permissions:
  redstonelimit.admin:
    description: Access to all RedstoneLimit commands
    default: op
  redstonelimit.bypass:
    description: Bypass all redstone and hopper limits
    default: false